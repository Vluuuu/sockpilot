name: Bug report
description: Report a reproducible SockPilot problem (no passwords or tokens)
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Never include proxy passwords, pairing keys, personal IP addresses or other secrets."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      placeholder: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: "1. Start bridge...\n2. Configure extension...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Brave 1.x, Node.js 22, SockPilot commit/version"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs (optional)
      description: Remove credentials, tokens, and personal network identifiers.
